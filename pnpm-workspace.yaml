packages:
  - apps/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  electron: true
  "@resvg/resvg-js": true
  msw: false
  # node-llama-cpp 必须允许 build scripts 运行，否则其原生二进制不会编译
  # （HEAD 里的 false 是 bug：导致运行时 GGUF 加载失败）
  node-llama-cpp: true
  # 遥测类 postinstall：显式拒绝执行（不联网、无副作用）
  autoevals: false
  '@scarf/scarf': false
  # electron-builder 26 引入的 Windows 安装器辅助包；仅打包 Squirrel 目标时用到，
  # 本项目出 NSIS 安装包，不需要其构建脚本
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - typescript-eslint@8.71.2
  - '@aws-sdk/credential-provider-node@3.972.86'
  - undici@8.12.4
  - vite@8.3.6

overrides:
  esbuild: ^0.25.0
  # ---- 安全补丁钉版（pnpm audit / Dependabot 告警，2026-10-15）----
  # 关键原则：按 **受影响范围** 定点钉版，绝不做跨 major 的全局替换。
  # 同一包存在互不兼容的 major 消费者时（js-yaml v4/v5、tar v6/v7、
  # postcss-selector-parser v6/v7），全局替换会把正常依赖打坏
  # （实测：js-yaml 全局升 5.x 直接让 @redocly/openapi-core 崩溃、openapi:gen 失败）。
  #
  # js-yaml：公告仅影响 v5.0.0–5.4.0（v4.x 不受影响、必须留在 v4 供 redocly/builder 使用）
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.3
  # tar：公告全部落在 7.5.x（v6.2.1 不受影响，且 @electron/rebuild/node-gyp@9 需要 v6）
  'tar@>=7.5.0 <7.5.22': ^7.5.22

  # @electron/get：electron-builder 26.x 调用 ElectronDownloadCacheMode（v3.1.0 起才导出；
  # v3.0.0 没有该符号，而 electron 41 自带 v5 也不导出该 CJS 名）。锁 3.1.x 供 app-builder-lib 使用，
  # electron 自身的 v5 需求不受影响。
  '@electron/get@>=3.0.0 <3.1.0': ^3.1.0
  # semver：公告 <5.7.2（5.x 线无更高补丁版可用时按上游最新 5.7 线处理）仅钉 5.x 受影响区间；
  # 该链路只出现在桌面打包期（app-builder-lib > tiny-async-pool）。
  'semver@>=5.0.0 <5.7.2': ^5.7.2
  # source-map-js：公告 <1.2.2，无 major 分裂，可直接钉
  source-map-js: ^1.2.2
  # shell-quote：公告 >=1.8.4 <1.11.0，concurrently 用 1.9.0，同 major 内可钉
  shell-quote: ^1.12.0
  # basic-ftp：公告 <=6.2.0，修复版 ≥6.2.1 仅在 v6 线；消费者 get-uri@8 声明 ^5.3.1。
  # 早前把崩溃误归因于它（真因是 @electron/get 需 3.1.x，已单独钉版）；重新核验依赖树确认
  # basic-ftp 只经 promptfoo(devDep) → proxy-agent → get-uri 引入，与 electron-builder 链路无关。
  # 现强制 v6 线，并以 promptfoo 实跑 + 打包实跑双重验证。
  # postcss-selector-parser：公告 <7.1.6 覆盖 v6 线；上游 @tailwindcss/typography 固定 "6.0.10"，
  # 全局升 7.x 以 web build + 页面渲染实测验证（若破样式则回退并登记残留）
  postcss-selector-parser: ^7.1.6
  # diff：公告 >=6.0.0 <8.0.3（唯一消费者是本项目自身声明的 ^8.0.4）
  'diff@>=6.0.0 <8.0.3': ^8.0.4
  basic-ftp: ^6.2.1
  # katex：项目统一钉到 0.18.9；rehype/remark/mermaid 运行验证通过，消除旧 0.16 传递副本告警。
  # simple-git 系列：node-llama-cpp 声明 ^3.36.0，此处强制升到已修复的 4.x
  # （本项目仅用其 embedding 推理，不触及 git 克隆路径；升级后以构建+回归验证）
  simple-git: ^4.0.2
  '@simple-git/argv-parser': ^2.0.1
  # extract-zip：公告给出 >=2.0.2，但 npm 上 2.0.1 已是最新发布版（无可升级目标），
  # electron 自身依赖 ^2.0.1；待上游发版后再钉（当前风险=构建期解压路径，非运行时代码路径）
  # node-forge / sprintf-js：保留上游兼容说明；本轮 node-forge 已锁到 1.4.2，audit 无 high/critical。
  # body-parser / multer：Nest 与 MCP 共享 Express 链路，强制使用已修复补丁线
  body-parser: ^2.4.0
  multer: ^2.5.0
  # undici：多协议 AI SDK 共用 provider-utils，统一到含 TLS/重定向/编码修复的补丁线
  undici: ^8.12.4
  # zod：统一应用与 AI SDK 使用已修复的内存耗尽补丁
  zod: ^4.6.6
  # Vite / happy-dom：前端工具链的安全补丁线（vite 8 起为 rolldown 内核）
  vite: ^8.3.6
  happy-dom: ^21.0.4
  # node-forge：promptfoo 的 jks-js 传递依赖，锁到当前已发布的安全版本
  node-forge: ^1.4.1
  # Azure Identity：promptfoo / Azure AI Projects 均接受 4.14.x，消除 MSAL Node <7.1 的高危传递依赖
  '@azure/identity': ^4.14.1
  # promptfoo 仍直接声明 7.0.x，强制补到已修复的 MSAL Node 7.1.x
  '@azure/msal-node': ^7.1.2
  # fast-uri：AJV 3.x 的同 major 修复版，修复 scheme/host 解析歧义
  fast-uri: ^3.1.9
  # glob/minimatch：仅提升受影响的现代 major，保留 Electron 老链路的 v7/v9/v5 兼容分支
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=10.0.0 <11.0.1': ^11.0.1
  # minimatch v11 保持 CommonJS/ESM 双入口，统一旧 Electron/OpenAPI 链路的 globparts DoS 修复
  minimatch: ^11.0.1
  # KaTeX：同一 0.x 线的安全补丁，测试 rehype/mermaid 后保留统一版本
  katex: ^0.18.9

# 显式声明「忽略构建脚本」（pnpm 10+ 机制）
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - autoevals
