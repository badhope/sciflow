name: Secret guard

# Narrow, deterministic check: block commits that contain a filled .env file or
# a high-confidence credential pattern. This is intentionally not a full scanner;
# it exists because a public open-source repo must never ship a live key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real .env file is tracked
        run: |
          # .env.example is the only permitted env file.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::A real .env file is tracked. Remove it and rotate any credential it contained."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Fail on high-confidence credential patterns in the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git diff --unified=0 "$base"...HEAD > /tmp/changes.diff || true
          else
            git diff --unified=0 HEAD^..HEAD > /tmp/changes.diff 2>/dev/null || : > /tmp/changes.diff
          fi

          # Ignore obviously fake test values so the guard stays a real signal.
          if grep -nEi 'sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' /tmp/changes.diff \
             | grep -vEi 'your-api-key|fixture|example|placeholder|redacted|dummy|test-key|sk-your' ; then
            echo "::error::A credential-like string appears in this change. Remove it and rotate the credential."
            exit 1
          fi
          echo "No credential pattern found in the diff."
