<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SciFlow" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="SciFlow — 本地优先的 AI 科研工作台：文献、写作、确定性质量门与投稿包" />
    <title>SciFlow · 本地优先的 AI 科研工作台</title>
    <script>
      (function () {
        try {
          var styles = ['sciflow', 'academic', 'paper', 'minimal', 'night', 'contrast'];
          var s = localStorage.getItem('sciflow-theme-style');
          document.documentElement.dataset.theme = styles.indexOf(s) >= 0 ? s : 'sciflow';
          // 产品默认亮色：无存储值即 light；用户显式选 dark / system 时仍以存储值为准
          var m = localStorage.getItem('sciflow-theme') || 'light';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'sciflow';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
