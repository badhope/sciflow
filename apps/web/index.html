<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="SciFlow — 全自动 AI 科研助手：文献调研、论文写作、全自动流水线、质量评分一站式完成" />
    <title>SciFlow · 全自动 AI 科研助手</title>
    <script>
      (function () {
        try {
          var styles = ['sciflow', 'academic', 'paper', 'minimal', 'night', 'contrast'];
          var s = localStorage.getItem('sciflow-theme-style');
          document.documentElement.dataset.theme = styles.indexOf(s) >= 0 ? s : 'sciflow';
          var m = localStorage.getItem('sciflow-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'sciflow';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
