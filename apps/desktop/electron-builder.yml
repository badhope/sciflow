# ============ SciFlow 桌面端打包配置（electron-builder） ============
appId: io.sciflow.desktop
productName: SciFlow
copyright: Copyright © 2026 SciFlow Contributors

directories:
  output: release
  buildResources: build

# 国内构建网络：Electron 二进制走 npmmirror，避免从 GitHub 下载 120MB+ 超时。
# electron-builder 自身的 nsis/winCodeSign 工具链仍可用
# ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/ 指定。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# Linux 云构建没有系统 wine 时，使用 electron-builder 的 Wine 11 工具带，
# 否则 NSIS 阶段的 elevate.exe 会直接 `spawn wine ENOENT`（本轮实测）。
toolsets:
  wine: "1.0.1"

# asar 只装主进程/preload 编译产物（小），重资源走 extraResources（asar 外，原生模块必须）
asar: true
files:
  - dist-electron/**/*
  - package.json

# 注意（踩坑记录，勿回退）：
# electron-builder 的 extraResources 过滤器里有硬编码规则
#   文件 app-builder-lib/out/util/filter.js → createFilter()
#     if (relative === "node_modules") return false;   // 永远排除**根级** node_modules
# 结果：当 from 目录自身就是 bundle 根（resources/server）时，其 node_modules（pnpm deploy 产出的
# 全部生产依赖）会被静默丢弃 —— 实测 0.4.0→0.4.1 安装包从 1.42GB 掉到 100MB，应用启动即崩。
# 规避方式：把 bundle 放进二级目录（resources/bundle/server），使相对路径不为 "node_modules"。
extraResources:
  # 发布包卫生：模型权重、适配器、本地数据库与密钥文件绝不进安装包。
  # 这里再设一道过滤器；prepare-server.mjs 还会在生成 bundle 后做物理清理与断言。
  - from: resources/bundle
    to: bundle
    filter:
      - "**/*"
      - "!**/*.gguf"
      - "!**/*.ggml"
      - "!**/*.safetensors"
      - "!**/*.onnx"
      - "!**/*.tflite"
      - "!**/models/**"
      - "!**/*.db"
      - "!**/*.db-*"
      - "!**/*.sqlite*"
      - "!**/.env"
      - "!**/.env.local"
      - "!**/.env.production"
      - "!**/.env.development"
      - "!**/.env.test"
  - from: resources/web
    to: web

# ---------- Windows ----------
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SciFlow
  artifactName: SciFlow-Setup-${version}-${arch}.${ext}

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: SciFlow-${version}-${arch}.${ext}

# ---------- Linux ----------
linux:
  icon: build/icon.png
  category: Science
  # pnpm workspace 包名是 @sciflow/desktop，默认 executableName 会变成 @sciflowdesktop，
  # AppImage 明确拒绝 @ 字符；显式指定合法可执行名。
  executableName: sciflow
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: SciFlow Contributors
  artifactName: SciFlow-${version}-${arch}.${ext}

# 压缩级别：normal（安装包体积与安装速度平衡）
compression: normal
npmRebuild: false
