<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SciFlow app icon">
  <!--
    SciFlow 主图标（App Icon Master · 1024×1024）· 墨流 2.0 · 2026-10-25
    概念：渐变圆角方底 + 白色主 S 水流 + 细数据闭环轨道 + 思想节点 + 收笔墨滴。
    规范：品牌渐变 #0b8079 → #0a7896 → #0b6fc4（135°），白色流线，圆角方底（r≈22%）。
    导出：本文件是唯一图标源；PNG/ICO/ICNS 由 scripts/generate-icons.mjs 从此渲染，禁止手改位图。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8079"/>
      <stop offset="0.52" stop-color="#0a7896"/>
      <stop offset="1" stop-color="#0b6fc4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 数据闭环轨道（细弧，右上入 → 左下出） -->
  <path d="M 750.4 241.6 A 368 368 0 1 0 241.6 750.4"
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.30"/>
  <!-- 主 S 水流 -->
  <path d="M 691.2 342.4 A 176 176 0 1 0 512 512 A 176 176 0 1 1 332.8 681.6"
        fill="none" stroke="#ffffff" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 思想节点 -->
  <circle cx="758.4" cy="211.2" r="51.2" fill="#ffffff"/>
  <!-- 收笔墨滴 -->
  <circle cx="310.4" cy="704" r="27.2" fill="#ffffff" opacity="0.75"/>
</svg>
