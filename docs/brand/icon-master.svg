    概念：墨流 S —— 两段几何圆弧咬合成水流（右上入水、左下出水）+ 思想节点。
    规范：品牌渐变 #0b8079 → #0a7896 → #0b6fc4（135°），白色流线，圆角方底（r≈22%）。
